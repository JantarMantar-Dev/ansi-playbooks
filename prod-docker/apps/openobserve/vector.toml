# -------------------------------------------------------------------------
# 1. SOURCE: Read Docker Logs
# -------------------------------------------------------------------------
[sources.docker_swarm_logs]
type = "docker_logs"
include = []      # Empty list = scrape ALL containers
exclude_containers = []      # You can add container names here to ignore them (e.g. "vector")

# -------------------------------------------------------------------------
# 2. TRANSFORM: Clean up Metadata
# -------------------------------------------------------------------------
[transforms.enrich_logs]
type = "remap"
inputs = ["docker_swarm_logs"]
source = '''
  # --- Standardize Timestamp ---
  # Docker timestamps can be tricky; this ensures they are formatted correctly for O2
  .timestamp = parse_timestamp!(.timestamp, format: "%Y-%m-%dT%H:%M:%S.%fZ")

  # --- Extract Swarm Metadata ---
  # Docker labels are messy (e.g., com.docker.swarm.service.name).
  # We map them to clean, top-level fields like "service", "stack", and "node"
  # so you can easily filter them in the OpenObserve UI.

  .service = .label."com.docker.swarm.service.name" || .image
  .stack = .label."com.docker.stack.namespace" || "standalone"
  .node_id = .label."com.docker.swarm.node.id" || "unknown"
  .container = .container_name
  
  # Add the actual hostname of the server (useful for debugging hardware issues)
  .host = get_hostname!() 

  # --- Optional: Clean up ---
  # Remove the massive list of raw labels to save space, now that we extracted what we need.
  # del(.label) 
'''

# -------------------------------------------------------------------------
# 3. SINK: Send to OpenObserve
# -------------------------------------------------------------------------
[sinks.openobserve]
type = "http"
inputs = ["enrich_logs"]
# "openobserve" is the service name from your docker-compose file
uri = "http://openobserve:5080/api/default/default/_json"
method = "post"
compression = "gzip"
encoding.codec = "json"

# AUTHENTICATION
# These MUST match the ZO_ROOT_USER_EMAIL and PASSWORD in your docker-compose.yml
