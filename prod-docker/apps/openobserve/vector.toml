# -------------------------------------------------------------------------
# 1. SOURCE: Read Docker Logs - Capture ALL containers
# -------------------------------------------------------------------------
[sources.docker_swarm_logs]
type = "docker_logs"
docker_host = "unix:///var/run/docker.sock"
# Exclude only the vector container itself to avoid recursive logging
exclude_containers = ["infra-openobserve-qfmox1_vector"]

# -------------------------------------------------------------------------
# 2. TRANSFORM: Clean up Metadata
# -------------------------------------------------------------------------
[transforms.enrich_logs]
type = "remap"
inputs = ["docker_swarm_logs"]
source = '''
  # --- Standardize Timestamp ---
  .timestamp = parse_timestamp!(.timestamp, format: "%Y-%m-%dT%H:%M:%S.%fZ")

  # --- Extract Swarm Metadata ---
  .service = .label."com.docker.swarm.service.name" || .image
  .stack = .label."com.docker.stack.namespace" || "standalone"
  .node_id = .label."com.docker.swarm.node.id" || "unknown"
  .container = .container_name
  
  # Add the actual hostname of the server
  .host = get_hostname!() 
'''

# -------------------------------------------------------------------------
# 3. SINK: Send to OpenObserve
# -------------------------------------------------------------------------
[sinks.openobserve]
type = "http"
inputs = ["enrich_logs"]
uri = "https://logs.jbaba.dev/api/default/default/_json"
method = "post"
auth.strategy = "basic"
auth.user = "naimish101.viradia@gmail.com"
auth.password = "M3L8XM5oprop5wir"
compression = "gzip"
encoding.codec = "json"
encoding.timestamp_format = "rfc3339"

[api]
enabled = true
address = "0.0.0.0:8686"